<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolarSense — Log in</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27%23f59e0b%27/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f59e0b">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <main class="login-card card">
    <div class="login-brand" id="login-brand"></div>
    <h1>Log in</h1>
    <p class="muted">Solar plant health monitor for operators and O&amp;M engineers.</p>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="login-error" role="alert"></p>
      <button id="login-button" type="submit" class="btn-primary">Log in</button>
    </form>
    <p class="login-demo">Demo login: <code>operator</code> / <code>solar123</code></p>
    <p id="static-note" class="login-demo" hidden>Demo copy: this login is for show only, not secure.</p>
  </main>
  <script src="js/mode.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
