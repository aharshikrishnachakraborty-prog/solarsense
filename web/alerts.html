<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolarSense — Alerts</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27%23f59e0b%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar"></header>

  <main class="page">
    <h1>Alerts</h1>
    <div id="takeaway" class="takeaway"><div class="skeleton" style="width: 55%"></div></div>

    <section class="card">
      <div class="toolbar">
        <select id="f-plant" aria-label="Plant filter">
          <option value="">All plants</option>
        </select>
        <select id="f-severity" aria-label="Severity filter"><option value="">All severities</option></select>
        <select id="f-type" aria-label="Fault type filter"><option value="">All fault types</option></select>
        <select id="f-status" aria-label="Status filter">
          <option value="Active">Open + Acknowledged</option><option value="">All statuses</option>
          <option value="Open">Open</option><option value="Acknowledged">Acknowledged</option><option value="Resolved">Resolved</option>
        </select>
        <label class="check"><input type="checkbox" id="f-day"> Replay date only</label>
        <input type="search" id="f-search" placeholder="Search id, inverter or reason…" aria-label="Search alerts">
        <button id="export-csv" title="Download the filtered alerts as a CSV file">Export CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="sortable" data-sort="severity">Severity ↕</th>
              <th>Fault</th><th>Where</th>
              <th class="sortable" data-sort="time">Start ↕</th>
              <th class="num">Duration</th>
              <th class="sortable num" data-sort="loss">Energy lost ↕</th>
              <th class="num">Money lost</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="alert-rows"><tr><td colspan="8"><div class="skeleton"></div></td></tr></tbody>
        </table>
      </div>
      <div class="btn-row"><button id="show-more" hidden>Show more</button><span id="row-count" class="muted"></span></div>
    </section>
  </main>

  <div id="panel-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/mode.js"></script>
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/alert_panel.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
